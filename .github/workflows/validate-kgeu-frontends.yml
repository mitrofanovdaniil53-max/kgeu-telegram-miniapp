name: Validate KGEU frontends and Worker

on:
  pull_request:
    paths:
      - "index.html"
      - "apps/vk/index.html"
      - "backend/**"
      - "workers/**"
      - "tests/**"
      - "docs/**"
      - "prototypes/**"
      - ".github/workflows/validate-kgeu-frontends.yml"
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "apps/vk/index.html"
      - "backend/**"
      - "workers/**"
      - "tests/**"
      - "docs/**"
      - "prototypes/**"
      - ".github/workflows/validate-kgeu-frontends.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse inline frontend scripts and Worker
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          for (const file of ['index.html', 'apps/vk/index.html', 'prototypes/student-service-dashboard.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
              .map(match => match[1])
              .filter(code => code.trim());

            if (!scripts.length) throw new Error(file + ': no inline scripts found');
            scripts.forEach((code, index) => {
              try {
                new Function(code);
              } catch (error) {
                throw new Error(file + ': inline script ' + (index + 1) + ': ' + error.message);
              }
            });
            console.log(file + ': ' + scripts.length + ' inline scripts parsed');
          }

          for (const file of ['backend/worker.js', 'workers/kgeu-schedule-bot/worker.js', 'workers/kgeu-vk-bot/worker.js']) {
            if (!fs.existsSync(file)) continue;
            const worker = fs.readFileSync(file, 'utf8')
              .replace(/\bexport default\s*\{/, 'const workerModule = {');
            try {
              new Function(worker);
            } catch (error) {
              throw new Error(file + ': ' + error.message);
            }
            console.log(file + ': parsed');
          }
          NODE
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test additive D1 migration
        run: python -m unittest discover -s tests -v
      - name: Test shared account-state merge and revision behavior
        run: node --test tests/worker_shared_state.test.cjs
      - name: Test schedule proxy query validation
        run: node --test tests/worker_schedule_proxy.test.cjs
      - name: Test legacy shared-state field preservation
        run: node --test tests/worker_legacy_field_preservation.test.cjs
      - name: Test VK launch signature validation
        run: node --test tests/worker_vk_launch_auth.test.cjs
      - name: Test VK manual sync edit-race protection
        run: node --test tests/vk_manual_sync_race.test.cjs
      - name: Test VK shared profile apply race protection
        run: node --test tests/vk_profile_apply_race.test.cjs
      - name: Test VK legacy service sync CAS and restore guards
        run: node --test tests/vk_legacy_sync_race.test.cjs
      - name: Test Telegram bot notifications and reminders
        run: node --test tests/telegram_bot_notifications.test.cjs
      - name: Test VK bot class reminder timing
        run: node --test tests/vk_bot_reminder_window.test.cjs
      - name: Test VK light/dark mobile glass controls and group labels
        run: node --test tests/vk_dark_theme_group_display.test.cjs
